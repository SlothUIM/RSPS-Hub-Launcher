plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.rspshub'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

compileJava.options.encoding = 'UTF-8'

javafx {
    version = '17.0.18'
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.media', 'javafx.web', 'javafx.swing']
}

application {
    mainClass = 'main'
    applicationName = 'RSPSHub'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.apache.commons:commons-lang3:3.14.0'
    implementation 'com.google.guava:guava:33.2.0-jre'
    implementation 'net.java.dev.jna:jna:5.14.0'
    implementation 'net.java.dev.jna:jna-platform:5.14.0'
    implementation 'org.json:json:20250517'
    implementation 'org.jsoup:jsoup:1.22.1'
    implementation 'io.javalin:javalin:6.3.0'
    implementation 'org.slf4j:slf4j-simple:2.0.13'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
        resources {
            srcDirs = ['src']
            exclude '**/*.java'
        }
    }
}

// ── JPACKAGE INSTALLER ────────────────────────────────────────────────────────

def isLinuxBuild = System.getProperty('os.name', '').toLowerCase().contains('linux')
def isMacBuild   = System.getProperty('os.name', '').toLowerCase().contains('mac')

task packageInstaller(type: Exec, dependsOn: installDist) {
    def jpackage  = "${System.getenv('JAVA_HOME') ?: '/usr'}/bin/jpackage"
    def inputDir  = "${buildDir}/install/RSPSHub/lib"
    def outputDir = "${buildDir}/installer"
    def icon      = isLinuxBuild || isMacBuild
        ? "${projectDir}/src/app_icon.png"
        : "${projectDir}/src/app_icon.ico"
    def pkgType   = isLinuxBuild ? 'deb' : isMacBuild ? 'dmg' : 'app-image'

    doFirst {
        delete outputDir
        mkdir outputDir
    }

    def args = [
        jpackage,
        '--input',           inputDir,
        '--dest',            outputDir,
        '--name',            'RSPS Hub',
        '--app-version',     version,
        '--main-jar',        'rsps-hub-launcher-1.0.0.jar',
        '--main-class',      'main',
        '--icon',            icon,
        '--type',            pkgType,
        '--java-options',    '--add-opens=javafx.graphics/com.sun.javafx.application=ALL-UNNAMED',
        '--java-options',    '--add-opens=javafx.base/com.sun.javafx.reflect=ALL-UNNAMED',
        '--vendor',          'RSPS Hub',
        '--description',     'The unified RSPS launcher'
    ]

    if (isLinuxBuild) {
        args += ['--linux-deb-maintainer', 'support@therspshub.com']
        args += ['--linux-menu-group',     'Game']
        args += ['--linux-shortcut']
        args += ['--java-options', '-Dprism.forceGPU=true']
        args += ['--java-options', '-Dprism.vsync=false']
    }

    commandLine args

    doLast {
        println "\nInstaller built → ${outputDir}"
        fileTree(outputDir).each { println "  $it.name" }
    }
}
